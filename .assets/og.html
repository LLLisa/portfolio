<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&family=Space+Mono&display=swap');
            * { margin: 0; box-sizing: border-box; }
            html, body { width: 1200px; height: 630px; }
            body {
                background: #08080a;
                color: #f4f4f7;
                font-family: 'Inter', sans-serif;
                position: relative;
                overflow: hidden;
                padding: 88px 96px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .grid {
                position: absolute; inset: 0;
                background-image:
                    linear-gradient(#1a1a22 1px, transparent 1px),
                    linear-gradient(90deg, #1a1a22 1px, transparent 1px);
                background-size: 72px 72px;
                -webkit-mask-image: radial-gradient(circle at 28% 45%, #000, transparent 72%);
            }
            .glow {
                position: absolute; top: -200px; right: -160px;
                width: 720px; height: 720px;
                background: radial-gradient(circle, rgba(123,108,255,0.28), transparent 62%);
            }
            .glow2 {
                position: absolute; bottom: -240px; left: -120px;
                width: 620px; height: 620px;
                background: radial-gradient(circle, rgba(198,242,78,0.14), transparent 60%);
            }
            .content { position: relative; z-index: 1; }
            .status {
                display: inline-flex; align-items: center; gap: 12px;
                font-family: 'Space Mono', monospace; font-size: 22px;
                color: #b6b6c2; border: 1px solid #232330; border-radius: 999px;
                padding: 10px 20px; margin-bottom: 40px;
            }
            .dot { width: 12px; height: 12px; border-radius: 50%; background: #c6f24e; }
            h1 {
                font-family: 'Space Grotesk', sans-serif; font-weight: 700;
                font-size: 132px; line-height: 0.92; letter-spacing: -0.04em;
            }
            h1 .accent {
                background: linear-gradient(120deg, #c6f24e, #3dd7ff);
                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            }
            .role {
                font-family: 'Space Mono', monospace; font-size: 30px;
                color: #b6b6c2; margin-top: 34px;
            }
            .role b { color: #c6f24e; font-weight: 400; }
            .url {
                position: absolute; bottom: 80px; left: 96px;
                font-family: 'Space Mono', monospace; font-size: 26px; color: #82828f;
                z-index: 1;
            }
            .mark {
                position: absolute; top: 80px; right: 96px; z-index: 1;
                width: 84px; height: 84px; border-radius: 20px;
                background: #c6f24e; color: #0a0a0a;
                display: grid; place-items: center;
                font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 38px;
            }
        </style>
    </head>
    <body>
        <div class="grid"></div>
        <div class="glow"></div>
        <div class="glow2"></div>
        <div class="mark">LK</div>
        <div class="content">
            <div class="status"><span class="dot"></span> Full-Stack &amp; AI Engineering</div>
            <h1>Lisa Anne<br /><span class="accent">Knox</span></h1>
            <div class="role"><b>Full-Stack Engineer</b> &nbsp;/&nbsp; New York, NY</div>
        </div>
        <div class="url">www.lisaaknox.com</div>
    </body>
</html>
